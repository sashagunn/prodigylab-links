name: SEO — IndexNow on deploy

# Уведомляем Bing / Yandex / Seznam / Naver о страницах, изменившихся в этом пуше.
# Состояние (.indexnow-state.json) в git не хранится, поэтому список URL берём
# из diff самого пуша — так CI не шлёт весь сайт на каждый коммит.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
  workflow_dispatch:
    inputs:
      all:
        description: 'Отправить все URL из sitemap (использовать редко)'
        type: boolean
        default: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ждём раскатку Vercel
        # Поисковик пойдёт проверять URL сразу. Если прод ещё не обновился,
        # он увидит старую версию или 404 и заявка сгорит впустую.
        run: sleep 90

      - name: Собираем список изменившихся URL
        id: urls
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          # Пустой/нулевой before — новая или пересозданная ветка: диффа не существует.
          # Раньше это тихо давало 0 изменённых URL; теперь — явная ошибка, а не молчание.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::github.event.before пуст или нулевой (новая/пересозданная ветка) — базы для diff нет. Не считаю это нулём изменённых URL."
            exit 1
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>cat_err.txt; then
            echo "::error::github.event.before ($BEFORE) недоступен в этом чекауте (force-push/переписанная история) — изменённые страницы не определить."
            cat cat_err.txt
            exit 1
          fi
          if ! git diff --name-only --diff-filter=ACM "$BEFORE" "$SHA" > diff_raw.txt 2>diff_err.txt; then
            echo "::error::git diff между $BEFORE и $SHA завершился ошибкой — изменённые страницы не определить."
            cat diff_err.txt
            exit 1
          fi
          grep -E '\.html$' diff_raw.txt \
            | grep -vE '^(node_modules/|scripts/|newdesign\.html$|course\.html$)' \
            | sed -e 's#index\.html$##' -e 's#^#https://prodigylab.studio/#' \
            | sort -u > changed.txt
          echo "mode=list" >> "$GITHUB_OUTPUT"
          echo "Изменилось URL: $(wc -l < changed.txt)"
          cat changed.txt

      - name: Отправка в IndexNow
        run: |
          if [ "${{ steps.urls.outputs.mode }}" = "all" ]; then
            node scripts/indexnow-submit.js --all
          elif [ -s changed.txt ]; then
            xargs -a changed.txt node scripts/indexnow-submit.js
          else
            echo "Изменившихся страниц нет — ничего не отправляю."
          fi

      - name: Логи отправки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-logs
          path: logs/indexnow/
          if-no-files-found: ignore
          retention-days: 30
